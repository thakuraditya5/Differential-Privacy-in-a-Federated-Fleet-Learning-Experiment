# Experiment-wide defaults
seed: 42
seeds:
  - 42
  - 43
  - 44

dataset:
  name: mnist
  num_clients: 8
  iid: false
  dirichlet_alpha: 0.3

model:
  name: mnist_cnn

federated:
  num_rounds: 20
  fraction_fit: 1.0
  fraction_evaluate: 1.0
  local_epochs: 1
  batch_size: 64
  learning_rate: 0.01

experiment:
  device: cpu
  output_dir: results
